<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#1b3a4b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Preceptor" />
  <title>Preceptor</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%231b3a4b'/><text y='68' x='50' text-anchor='middle' font-size='52' fill='%23e8c36a'>P</text></svg>" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <style>
    :root {
      --ink: #1b3a4b; --ink-2: #2c5364; --gold: #e8c36a; --cream: #f6f1e6;
      --paper: #fffdf8; --line: #e4d9c5; --ok: #2f7d5a; --warn: #c45c26;
      --muted: #6b7c86; --shadow: 0 10px 30px rgba(27,58,75,.12); --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--cream); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
    body { padding-bottom: 88px; min-height: 100dvh; }
    header.app {
      position: sticky; top: 0; z-index: 20;
      background: linear-gradient(160deg, var(--ink), var(--ink-2));
      color: #fff; padding: 16px 16px 14px; box-shadow: 0 8px 24px rgba(27,58,75,.25);
    }
    header.app h1 { margin: 0; font-size: 1.15rem; }
    header.app p { margin: 4px 0 0; opacity: .8; font-size: .82rem; }
    .wrap { padding: 14px; max-width: 760px; margin: 0 auto; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .kpi { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; }
    .kpi b { display: block; font-size: 1.25rem; }
    .kpi span { font-size: .72rem; color: var(--muted); }
    .search, input, select, textarea {
      width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
      background: #fff; font-size: 1rem; font-family: inherit;
    }
    .search { background: var(--paper); margin-bottom: 12px; }
    textarea { min-height: 88px; resize: vertical; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
    .student { display: flex; gap: 12px; align-items: center; cursor: pointer; }
    .avatar { width: 46px; height: 46px; border-radius: 14px; background: var(--ink); color: var(--gold); display: grid; place-items: center; font-weight: 700; flex: none; }
    .meta { flex: 1; min-width: 0; }
    .meta h3 { margin: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta small { color: var(--muted); }
    .badge { font-size: .7rem; padding: 4px 8px; border-radius: 999px; background: #efe6d2; color: var(--ink); font-weight: 600; white-space: nowrap; }
    .badge.ok { background: #d9efe4; color: var(--ok); }
    .badge.warn { background: #f8e2d6; color: var(--warn); }
    nav.tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
      border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); z-index: 30;
    }
    nav.tabbar button { border: 0; background: none; color: var(--muted); font-size: .72rem; padding: 6px; }
    nav.tabbar button.on { color: var(--ink); font-weight: 700; }
    nav.tabbar button span { display: block; font-size: 1.15rem; }
    .hidden { display: none !important; }
    h2.sec { font-size: 1.05rem; margin: 6px 0 10px; }
    label { display: block; font-size: .8rem; color: var(--muted); margin: 10px 0 4px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 14px; padding: 12px 14px; font-weight: 700; cursor: pointer; font-size: .95rem; }
    .btn.primary { background: var(--ink); color: #fff; width: 100%; margin-top: 12px; }
    .btn.ghost { background: #efe6d2; color: var(--ink); }
    .btn.danger { background: #f8e2d6; color: var(--warn); }
    .btn.small { padding: 8px 10px; font-size: .82rem; border-radius: 10px; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .month-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .mcell { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 4px; text-align: center; font-size: .72rem; }
    .mcell.done { background: #d9efe4; border-color: #b7dfc8; }
    .hist { border-left: 3px solid var(--gold); padding-left: 10px; margin: 10px 0; }
    .hist h4 { margin: 0 0 2px; font-size: .95rem; }
    .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 999px; font-size: .85rem; z-index: 50; opacity: 0; pointer-events: none; transition: .25s; max-width: 90%; }
    .toast.show { opacity: 1; }
    .empty { text-align: center; color: var(--muted); padding: 24px 10px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: #efe6d2; border-radius: 999px; padding: 6px 10px; font-size: .8rem; margin: 0 6px 6px 0; }
    .chip button { border: 0; background: none; color: var(--warn); font-weight: 700; padding: 0; }
    .check { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; font-size: .92rem; }
    .check input { width: 18px; height: 18px; margin-top: 2px; flex: none; }
    .back { background: none; border: 0; color: #fff; font-size: .9rem; padding: 0 0 8px; }
    .hint { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }
    hr.sep { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
    .wizard { max-width: 520px; margin: 24px auto; }
  </style>
</head>
<body>
  <header class="app" id="hdr"><h1>Preceptor</h1><p>Reuniones de tutoría</p></header>
  <main class="wrap" id="app"></main>
  <nav class="tabbar" id="tabs">
    <button class="on" data-tab="home" onclick="go('home')"><span>🏠</span>Inicio</button>
    <button data-tab="alumnos" onclick="go('alumnos')"><span>👥</span>Alumnos</button>
    <button data-tab="nueva" onclick="go('nueva')"><span>＋</span>Reunión</button>
    <button data-tab="ajustes" onclick="go('ajustes')"><span>⚙</span>Ajustes</button>
  </nav>
  <div class="toast" id="toast"></div>

<script>
const KEY = "preceptor-app-v2";
const KEY_OLD = "preceptor-2627-v1";
const MESES_DEF = ["septiembre","octubre","noviembre","diciembre","enero","febrero","marzo","abril","mayo","junio"];
const MES_LABEL = {septiembre:"Sep",octubre:"Oct",noviembre:"Nov",diciembre:"Dic",enero:"Ene",febrero:"Feb",marzo:"Mar",abril:"Abr",mayo:"May",junio:"Jun",julio:"Jul",agosto:"Ago"};
const TIPOS_DEF = [
  {id:"individual", label:"Individual (alumno)"},
  {id:"familia", label:"Con familia"},
  {id:"equipo", label:"Equipo docente"},
  {id:"seguimiento", label:"Seguimiento"}
];
const OBJ_DEF = [
  {id:"acad", titulo:"Seguimiento académico"},
  {id:"hab", titulo:"Hábitos de estudio"},
  {id:"conv", titulo:"Convivencia y clima"},
  {id:"emo", titulo:"Bienestar emocional"},
  {id:"fam", titulo:"Coordinación con la familia"}
];
const DEMO = [
  {nombre:"Izan", apellidos:"Pérez Calvo", curso:"3 PRIM A", nac:"2018-03-12", primer:"2026-09-21"},
  {nombre:"Leo", apellidos:"Herranz González", curso:"5 PRIM A", nac:"2016-05-08", primer:"2026-09-17"},
  {nombre:"Iñaki", apellidos:"Caballero Ortiz", curso:"5 PRIM B", nac:"2016-01-02", primer:"2026-09-17"},
  {nombre:"Pablo", apellidos:"Casado Romero", curso:"5 PRIM B", nac:"2016-03-09", primer:"2026-09-17"},
  {nombre:"Rodrigo", apellidos:"Coello Martín", curso:"5 PRIM B", nac:"2016-10-08", primer:"2026-09-17"},
  {nombre:"Rodrigo", apellidos:"Marcuello González", curso:"5 PRIM B", nac:"2016-03-09", primer:"2026-09-17"},
  {nombre:"Íñigo", apellidos:"Campoy González", curso:"6 PRIM A", nac:"2015-09-09", primer:"2026-09-23"},
  {nombre:"Lucas", apellidos:"García Dueñas", curso:"6 PRIM A", nac:"2015-09-08", primer:"2026-09-14"},
  {nombre:"Erick Ditiane", apellidos:"Monteiro", curso:"6 PRIM A", nac:"2015-05-05", primer:"2026-09-24"},
  {nombre:"Eduardo Javier", apellidos:"Rosero Andújar", curso:"6 PRIM A", nac:"2015-01-28", primer:"2026-09-24"},
  {nombre:"Ricardo Henrique", apellidos:"Silva Costa", curso:"6 PRIM A", nac:"2015-11-12", primer:"2026-09-24"},
  {nombre:"David", apellidos:"Arriero Chera", curso:"6 PRIM C", nac:"2015-07-08", primer:"2026-09-17"},
  {nombre:"José Francisco", apellidos:"García Cánovas", curso:"6 PRIM C", nac:"2015-03-20", primer:"2026-09-17"},
  {nombre:"Eduardo", apellidos:"López De Villanueva", curso:"6 PRIM C", nac:"2015-11-20", primer:"2026-09-17"},
  {nombre:"Gonzalo", apellidos:"Marco Gonzalo", curso:"6 PRIM C", nac:"2015-09-03", primer:"2026-09-17"},
  {nombre:"Pablo", apellidos:"Toril Fernández", curso:"6 PRIM C", nac:"2015-12-17", primer:"2026-09-23"}
];

let db = loadDB();
let view = {tab:"home", alumno:null, reunion:null, q:"", setup:false};

function uid(){ return crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random(); }
function P(){ return db.profiles.find(p => p.id === db.currentProfileId) || db.profiles[0]; }
function alumnos(){ return (P().alumnos || []).filter(a => a.activo !== false); }
function allAlumnos(){ return P().alumnos || []; }

function newProfile(extra={}){
  return {
    id: uid(),
    nombre: extra.nombre || "",
    iniciales: extra.iniciales || "",
    centro: extra.centro || "",
    cursoEscolar: extra.cursoEscolar || "2026-2027",
    meses: extra.meses || [...MESES_DEF],
    preceptores: extra.preceptores || (extra.iniciales ? [extra.iniciales] : []),
    preceptorActivo: extra.iniciales || "",
    tiposReunion: extra.tiposReunion || JSON.parse(JSON.stringify(TIPOS_DEF)),
    objetivosCatalogo: extra.objetivosCatalogo || JSON.parse(JSON.stringify(OBJ_DEF)),
    metaMensual: extra.metaMensual ?? 1,
    alumnos: extra.alumnos || [],
    reuniones: extra.reuniones || []
  };
}

function loadDB(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.profiles?.length) return parsed;
    }
  } catch(e) {}
  try {
    const old = localStorage.getItem(KEY_OLD);
    if (old) {
      const o = JSON.parse(old);
      const prof = newProfile({
        nombre: "Preceptor original",
        iniciales: o.settings?.preceptorActivo || "AMB",
        preceptores: ["AMB","JML"],
        preceptorActivo: o.settings?.preceptorActivo || "AMB",
        alumnos: DEMO.map((d,i) => ({...d, id: i+1, defaultPreceptor: "AMB", objetivos: [], notas:"", activo:true})),
        reuniones: o.reuniones || []
      });
      return {version:2, currentProfileId: prof.id, profiles:[prof]};
    }
  } catch(e) {}
  return {version:2, currentProfileId:null, profiles:[]};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2400);
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function full(a){ return `${a.nombre||""} ${a.apellidos||""}`.trim(); }
function ini(a){
  const n = (a.nombre||"?").trim()[0] || "?";
  const p = (a.apellidos||"").trim()[0] || "";
  return (n+p).toUpperCase();
}
function fmt(iso){
  if(!iso) return "—";
  const [y,m,d] = String(iso).split("-");
  if(!d) return iso;
  return `${d}/${m}/${y}`;
}
function mesDe(iso){
  if(!iso) return null;
  const d = new Date(iso+"T12:00:00");
  if (isNaN(d)) return null;
  return ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][d.getMonth()];
}
function mesActual(){
  const name = mesDe(new Date().toISOString().slice(0,10));
  const meses = P()?.meses || MESES_DEF;
  return meses.includes(name) ? name : meses[0];
}
function reunionesDe(id){ return (P().reuniones||[]).filter(r => r.alumnoId==id).sort((a,b)=> String(b.fecha).localeCompare(String(a.fecha))); }
function tieneMes(id, mes){ return (P().reuniones||[]).some(r => r.alumnoId==id && mesDe(r.fecha)===mes); }

function go(tab, extra={}){
  view = {...view, tab, ...extra};
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("on", b.dataset.tab===tab ||
    (tab==="ficha" && b.dataset.tab==="alumnos") ||
    (tab==="alumnoForm" && b.dataset.tab==="alumnos") ||
    (tab==="editar" && b.dataset.tab==="nueva")
  ));
  render();
  window.scrollTo(0,0);
}

function render(){
  const el = document.getElementById("app");
  const hdr = document.getElementById("hdr");
  const tabs = document.getElementById("tabs");
  if (!db.profiles.length || view.setup) {
    tabs.classList.add("hidden");
    hdr.innerHTML = `<h1>Bienvenido</h1><p>Crea tu espacio de preceptuados</p>`;
    el.innerHTML = renderSetup();
    return;
  }
  tabs.classList.remove("hidden");
  const p = P();
  if (view.tab==="ficha") {
    const a = allAlumnos().find(x=>x.id==view.alumno);
    if(!a){ go("alumnos"); return; }
    hdr.innerHTML = `<button class="back" onclick="go('alumnos')">← Alumnos</button><h1>${esc(full(a))}</h1><p>${esc(a.curso||"")}</p>`;
    el.innerHTML = renderFicha(a);
  } else if (view.tab==="alumnoForm") {
    hdr.innerHTML = `<button class="back" onclick="go(view.alumno?'ficha':'alumnos',{alumno:view.alumno})">← Atrás</button><h1>${view.alumno?"Editar alumno":"Nuevo alumno"}</h1><p></p>`;
    el.innerHTML = renderAlumnoForm(view.alumno);
  } else if (view.tab==="editar") {
    hdr.innerHTML = `<button class="back" onclick="go('ficha',{alumno:view.alumno})">← Ficha</button><h1>Editar reunión</h1><p></p>`;
    el.innerHTML = renderForm(view.reunion);
  } else {
    hdr.innerHTML = `<h1>${esc(p.nombre || "Preceptor")}</h1><p>${esc([p.iniciales, p.cursoEscolar, p.centro].filter(Boolean).join(" · "))}</p>`;
    if (view.tab==="home") el.innerHTML = renderHome();
    if (view.tab==="alumnos") el.innerHTML = renderAlumnos();
    if (view.tab==="nueva") el.innerHTML = renderForm();
    if (view.tab==="ajustes") el.innerHTML = renderAjustes();
  }
}

function renderSetup(){
  return `
    <div class="wizard">
      <div class="card">
        <h2 class="sec">Tu perfil de profesor</h2>
        <p class="hint">Cada profesor puede tener su propia lista de preceptuados en este mismo dispositivo.</p>
        <form onsubmit="crearPerfil(event)">
          <label>Nombre</label>
          <input name="nombre" required placeholder="Ana Martínez Blanco" />
          <div class="row2">
            <div><label>Iniciales</label><input name="iniciales" required placeholder="AMB" maxlength="8" /></div>
            <div><label>Curso escolar</label><input name="cursoEscolar" value="2026-2027" /></div>
          </div>
          <label>Centro (opcional)</label>
          <input name="centro" placeholder="Colegio…" />
          <label>Otros preceptores del equipo (separados por coma)</label>
          <input name="otros" placeholder="JML, LPG" />
          <button class="btn primary" type="submit">Crear mi lista vacía</button>
        </form>
        <div class="actions">
          <button class="btn ghost" style="flex:1" type="button" onclick="crearPerfilDemo()">Empezar con el ejemplo 26/27</button>
        </div>
        <p class="hint">El ejemplo carga los 16 alumnos del archivo original. Luego puedes borrar, editar o añadir.</p>
      </div>
      <div class="card">
        <h2 class="sec">¿Ya tienes copia de seguridad?</h2>
        <button class="btn ghost" style="width:100%" type="button" onclick="document.getElementById('imp0').click()">Restaurar JSON</button>
        <input id="imp0" type="file" accept="application/json" class="hidden" onchange="importarJSON(event)" />
      </div>
    </div>`;
}

function crearPerfil(ev){
  ev.preventDefault();
  const f = ev.target;
  const iniciales = f.iniciales.value.trim().toUpperCase();
  const otros = f.otros.value.split(",").map(s=>s.trim().toUpperCase()).filter(Boolean);
  const preceptores = [...new Set([iniciales, ...otros])];
  const prof = newProfile({
    nombre: f.nombre.value.trim(),
    iniciales, centro: f.centro.value.trim(),
    cursoEscolar: f.cursoEscolar.value.trim() || "2026-2027",
    preceptores, preceptorActivo: iniciales
  });
  db.profiles.push(prof);
  db.currentProfileId = prof.id;
  view.setup = false;
  save(); toast("Perfil creado"); go("alumnos");
}
function crearPerfilDemo(){
  const prof = newProfile({
    nombre: "Preceptor ejemplo",
    iniciales: "AMB",
    preceptores: ["AMB","JML"],
    preceptorActivo: "AMB",
    cursoEscolar: "2026-2027",
    alumnos: DEMO.map((d,i)=>({...d, id: uid(), defaultPreceptor:"AMB", objetivos:[], notas:"", activo:true}))
  });
  prof.reuniones = DEMO.map(d => {
    const a = prof.alumnos.find(x => x.nombre===d.nombre && x.apellidos===d.apellidos);
    return {id:uid(), alumnoId:a.id, fecha:d.primer, hora:"09:00", preceptor:"AMB", tipo:"individual", asistentes:"Alumno", temas:"Primera tutoría del curso", acuerdos:"", notas:"Cargada del ejemplo.", auto:true};
  });
  db.profiles.push(prof);
  db.currentProfileId = prof.id;
  view.setup = false;
  save(); toast("Ejemplo cargado"); go("home");
}

function ultimaReunion(id){
  const rs = reunionesDe(id);
  return rs.length ? rs[0].fecha : null;
}
function diasDesde(iso){
  if(!iso) return 9999;
  const d = new Date(iso + "T12:00:00");
  if(isNaN(d)) return 9999;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function textoDesde(iso){
  if(!iso) return "Nunca";
  const d = diasDesde(iso);
  if(d < 0) return "futura";
  if(d === 0) return "hoy";
  if(d === 1) return "ayer";
  if(d < 30) return d + " días";
  if(d < 365) return Math.floor(d/30) + " mes" + (Math.floor(d/30)>1?"es":"");
  return Math.floor(d/365) + " año" + (Math.floor(d/365)>1?"s":"");
}

function renderHome(){
  const p = P();
  const list = alumnos();
  if (!list.length) {
    return `<div class="card empty">
      <p>Todavía no hay preceptuados.</p>
      <button class="btn primary" onclick="go('alumnoForm',{alumno:null})">Añadir el primero</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="go('ajustes')">Importar lista o abrir ajustes</button>
    </div>`;
  }
  const mes = mesActual();
  const hechos = list.filter(a => tieneMes(a.id, mes)).length;
  const pend = list.length - hechos;
  const pendientes = list.filter(a => !tieneMes(a.id, mes));
  const hoy = new Date().toISOString().slice(0,10);
  const proximas = (p.reuniones||[]).filter(r => r.fecha >= hoy).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,6);
  const recientes = (p.reuniones||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,5);

  const porTiempo = list.map(a => ({
    a,
    ultima: ultimaReunion(a.id),
    dias: diasDesde(ultimaReunion(a.id))
  })).sort((x,y) => y.dias - x.dias);

  return `
    <div class="kpis">
      <div class="kpi"><b>${hechos}/${list.length}</b><span>${(MES_LABEL[mes]||mes)} hecho</span></div>
      <div class="kpi"><b>${pend}</b><span>Pendientes</span></div>
      <div class="kpi"><b>${(p.reuniones||[]).length}</b><span>Reuniones</span></div>
    </div>
    <div class="card">
      <h2 class="sec">Más tiempo sin reunión</h2>
      ${porTiempo.slice(0,8).map(({a,ultima,dias}) => `
        <div class="student" onclick="go('ficha',{alumno:'${a.id}'})" style="${dias>=30||!ultima?'background:#fff8f5;border-radius:12px;padding:8px;margin:-4px -4px 6px':''}">
          <div class="avatar">${esc(ini(a))}</div>
          <div class="meta">
            <h3>${esc(full(a))}</h3>
            <small>${esc(a.curso||"Sin curso")} · ${ultima ? "Última "+fmt(ultima) : "Sin reuniones"}</small>
          </div>
          <span class="badge ${!ultima||dias>=30?"warn":dias>=14?"ok":"ok"}">${esc(textoDesde(ultima))}</span>
        </div>
      `).join("<hr class='sep'>")}
    </div>
    <div class="card">
      <h2 class="sec">Pendientes de ${MES_LABEL[mes]||mes}</h2>

async function importarFichaWord(ev, alumnoId){
  const file = ev.target.files[0];
  if(!file) return;
  toast("Leyendo ficha…");
  try {
    let text = "";
    if (file.name.toLowerCase().endsWith(".docx")) {
      if (typeof mammoth === "undefined") { toast("No se pudo cargar el lector de Word"); return; }
      const arr = await file.arrayBuffer();
      const result = await mammoth.extractRawText({arrayBuffer: arr});
      text = result.value || "";
    } else {
      text = await file.text();
    }
    text = text.replace(/\r/g, "").trim();
    if (!text) { toast("El archivo está vacío"); return; }
    aplicarFicha(alumnoId, text, file.name);
  } catch(e) {
    console.error(e);
    toast("No se pudo leer el archivo");
  }
  ev.target.value = "";
}

function aplicarFicha(alumnoId, text, filename){
  const p = P();
  const a = p.alumnos.find(x => x.id == alumnoId);
  if (!a) return;

  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  let nac = a.nac || "";
  const family = [];
  const meetings = [];
  let current = null;

  const dateRe = /^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\s*$/;
  const birthRe = /\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/;

  for (const line of lines) {
    const dm = line.match(dateRe);
    if (dm) {
      if (current) meetings.push(current);
      const day = dm[1].padStart(2,"0");
      const mon = dm[2].padStart(2,"0");
      let year = dm[3];
      if (!year) year = new Date().getFullYear().toString();
      else if (year.length === 2) year = "20" + year;
      current = { fecha: `${year}-${mon}-${day}`, temas: "" };
      continue;
    }
    if (!nac) {
      const bm = line.match(birthRe);
      if (bm && !current) {
        const y = bm[3], m = bm[2].padStart(2,"0"), d = bm[1].padStart(2,"0");
        nac = `${y}-${m}-${d}`;
        continue;
      }
    }
    if (current) {
      current.temas += (current.temas ? "\n" : "") + line;
    } else {
      if (!/^\d{6,}$/.test(line) && !/^https?:\/\//i.test(line) && line.length > 2) {
        family.push(line);
      }
    }
  }
  if (current) meetings.push(current);

  if (nac) a.nac = nac;
  if (family.length) {
    const extra = family.join("\n");
    a.notas = a.notas ? (a.notas + "\n\n" + extra).trim() : extra;
  }
  a.fichaArchivo = filename;
  a.fichaTexto = text.slice(0, 8000);

  let added = 0;
  meetings.forEach(m => {
    if (!m.temas.trim()) return;
    const exists = (p.reuniones||[]).some(r => r.alumnoId == a.id && r.fecha === m.fecha && (r.temas||"").includes(m.temas.slice(0,40)));
    if (exists) return;
    p.reuniones.push({
      id: uid(),
      alumnoId: a.id,
      fecha: m.fecha,
      hora: "",
      preceptor: a.defaultPreceptor || p.preceptorActivo || p.iniciales,
      tipo: "individual",
      asistentes: "Alumno",
      temas: m.temas.trim(),
      acuerdos: "",
      notas: "Importado de " + filename,
      auto: true
    });
    added++;
  });

  save();
  toast(added ? `Ficha importada · ${added} reunión${added===1?"":"es"}` : "Ficha importada (sin reuniones nuevas)");
  go("ficha", {alumno: a.id});
}

function addChip(field, inputId, upper){
  const el = document.getElementById(inputId);
  let v = (el.value||"").trim();
  if(!v) return;
  if(upper) v = v.toUpperCase();
  const p = P();
  if(!p[field].includes(v)) p[field].push(v);
  if(field==="preceptores" && !p.preceptorActivo) p.preceptorActivo = v;
  el.value=""; save(); render();
}

function toggleMes(m, on){
  const p = P();
  if(on && !p.meses.includes(m)) p.meses.push(m);
  if(!on) p.meses = p.meses.filter(x=>x!==m);
  const order = ["septiembre","octubre","noviembre","diciembre","enero","febrero","marzo","abril","mayo","junio","julio","agosto"];
  p.meses.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  save();
}
function cambiarPerfil(id){
  db.currentProfileId = id; save(); toast("Perfil cambiado"); go("home");
}
function borrarPerfil(){
  if(!confirm("Esto borra la lista y las reuniones de este profesor en el dispositivo. ¿Continuar?")) return;
  db.profiles = db.profiles.filter(p => p.id !== P().id);
  db.currentProfileId = db.profiles[0]?.id || null;
  save(); toast("Perfil eliminado");
  if(!db.profiles.length){ view.setup=true; render(); } else go("home");
}
function restaurarBajas(){
  P().alumnos.forEach(a => a.activo = true); save(); toast("Restaurados"); render();
}

function renderResumen(){
  const p = P();
  if(!alumnos().length) return `<p class="hint">Sin alumnos.</p>`;
  let html = `<div style="overflow:auto"><table style="border-collapse:collapse;width:100%;font-size:.75rem">
    <tr><th style="text-align:left;padding:4px">Alumno</th>${p.meses.map(m=>`<th style="padding:4px">${MES_LABEL[m]||m.slice(0,3)}</th>`).join("")}</tr>`;
  alumnos().forEach(a=>{
    html += `<tr><td style="padding:4px 6px 4px 0">${esc(a.nombre)} ${esc((a.apellidos||"").split(" ")[0]||"")}</td>`;
    p.meses.forEach(m=>{
      const rs = (p.reuniones||[]).filter(r=>r.alumnoId==a.id && mesDe(r.fecha)===m);
      html += `<td style="text-align:center;padding:4px">${esc(rs.map(r=>r.preceptor).join("/")||"")}</td>`;
    });
    html += `</tr>`;
  });
  return html + `</table></div>`;
}

function descargarPlantilla(){
  if(typeof XLSX==="undefined"){ toast("No se pudo cargar Excel"); return; }

  const wb = XLSX.utils.book_new();

  XLSX.writeFile(wb, "Plantilla_preceptuados.xlsx");
}

function importarTabla(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const wb = XLSX.read(reader.result, {type:"array", cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
      if(!rows.length){ toast("La hoja está vacía"); return; }
      const norm = k => String(k||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
      let added = 0;
      rows.forEach(row => {
        const map = {};
        Object.keys(row).forEach(k => map[norm(k)] = row[k]);
        const nombre = String(map.nombre || map.name || "").trim();
        let apellidos = String(map.apellidos || map.apellido || "").trim();
        if(!nombre && map.alumno){
          const parts = String(map.alumno).trim().split(/\s+/);
          map.nombre = parts.shift();
          apellidos = parts.join(" ");
        }
        const nom = String(map.nombre||nombre).trim();
        if(!nom) return;
        const nac = parseDateCell(map.nacimiento || map.nac || map.fecha_nacimiento);
        const primer = parseDateCell(map["primera tutoria"] || map.primera || map.primer);
        P().alumnos.push({
          id: uid(),
          nombre: nom,
          apellidos,
          curso: String(map.curso || map.grupo || map.clase || "").trim(),
          nac, primer,
          defaultPreceptor: String(map.preceptor || P().preceptorActivo || P().iniciales).trim(),
          objetivos: [], notas: String(map.notas||"").trim(), activo:true
        });
        added++;
      });
      save(); toast(added+" alumnos importados"); go("alumnos");
    } catch(e){ console.error(e); toast("No se pudo leer el archivo"); }
  };
  reader.readAsArrayBuffer(file);
}
function parseDateCell(v){
  if(!v) return "";
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){
    const y = m[3].length===2 ? "20"+m[3] : m[3];
    return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  }
  return "";
}

function exportarXlsx(){
  if(typeof XLSX==="undefined"){ toast("No se pudo cargar Excel"); return; }
  const p = P();
  const wb = XLSX.utils.book_new();
  const header = ["Nº","Curso","Nombre","Apellidos","Nacimiento", ...p.meses.map(m=>m.toUpperCase()), "Objetivos"];
  const rows = [header];
  alumnos().forEach((a,i)=>{
    const row = [i+1, a.curso||"", a.nombre, a.apellidos||"", fmt(a.nac)];
    p.meses.forEach(m=>{
      const rs = (p.reuniones||[]).filter(r=>r.alumnoId==a.id && mesDe(r.fecha)===m);
      row.push(rs.map(r=>r.preceptor).join(" / "));
    });
    row.push((a.objetivos||[]).map(id => p.objetivosCatalogo.find(o=>o.id===id)?.titulo || id).join("; "));
    rows.push(row);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "Preceptuados");
  const det = [["Fecha","Hora","Alumno","Curso","Preceptor","Tipo","Asistentes","Temas","Acuerdos","Notas"]];
  (p.reuniones||[]).slice().sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).forEach(r=>{
    const a = allAlumnos().find(x=>x.id==r.alumnoId);
    det.push([fmt(r.fecha), r.hora||"", a?full(a):"", a?.curso||"", r.preceptor||"", tipoLabel(r.tipo), r.asistentes||"", r.temas||"", r.acuerdos||"", r.notas||""]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), "Actas");
  const al = [["Nombre","Apellidos","Curso","Nacimiento","Primera tutoria","Preceptor","Notas","Objetivos"]];
  alumnos().forEach(a=> al.push([a.nombre,a.apellidos,a.curso,a.nac,a.primer,a.defaultPreceptor,a.notas,(a.objetivos||[]).map(id=>p.objetivosCatalogo.find(o=>o.id===id)?.titulo||id).join("; ")]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(al), "Alumnos");
  XLSX.writeFile(wb, `Preceptuados_${(p.iniciales||"prof")}_${(p.cursoEscolar||"").replace("/","-")}.xlsx`);
  toast("Excel descargado");
}

  a.href = URL.createObjectURL(blob);
  a.download = "preceptor-backup.json";

function importarJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.profiles?.length) {
        db = data;
        if (!db.currentProfileId) db.currentProfileId = db.profiles[0].id;
      } else if (data.reuniones && !data.profiles) {
        const prof = newProfile({nombre:"Importado", iniciales:"PROF", reuniones:data.reuniones, alumnos:data.alumnos||[]});
        db.profiles.push(prof); db.currentProfileId = prof.id;
      } else throw new Error("formato");
      view.setup = false; save(); toast("Datos restaurados"); go("home");
    } catch(e){ toast("Archivo no válido"); }
  };
  reader.readAsText(file);
}
